 pool.filter(r=>r.v>=2).slice(0,ml).forEach(r=>out.push(r));pool.forEach(r=>{if(out.length<n&&!out.includes(r))out.push(r)});

function lines(ids,size){const m={};
 ids.forEach(id=>{const r=rec(id);if(!r)return;const k=size/r.s;
  r.i.forEach(([n,q])=>{if(S.have.includes(n))return;const a=parse(q),e=m[n]||(m[n]={n,q,u:0,need:null,ok:true});e.u++;
